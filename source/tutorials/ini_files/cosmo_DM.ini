[run]
t_end_var=aexp          ; We use aexp as the timing variable for our run
tend=1.0                ; We stop the run at a=1.0

enable_output=true      ; Enabled visualization snapshots

nstepmax=-1             ; No limit on maximum number of steps

output_slice_var=aexp   ; We want to output snapshots at a=0.0, 0.5 and 1.0
output_timeslice=0.5

initial_conditions=grafic_fields,particle_grid ; Initial conditions are Grafic + particle distribution from this grafic file

nlog=1 ; We log info every 10 iterations on the console

[mesh]
ndim=3 ; 3D run                   

# All boundary conditions are periodic
boundary_type_xmin=periodic
boundary_type_xmax=periodic            
boundary_type_ymin=periodic
boundary_type_ymax=periodic            
boundary_type_zmin=periodic
boundary_type_zmax=periodic            

# Box size is 1.0
xmin=0.0                 
xmax=591.1912231445312
ymin=0.0       
ymax=591.1912231445312
zmin=0.0                 
zmax=591.1912231445312

[amr]
# Minimum and maximum levels of refinement
level_min=5
level_max=13

# Block size for each leaf of the octree
bx=4                   
by=4                   
bz=4                   

# Refinement cycle happens every 5 iterations, we don't load balance
cycle_frequency=5
load_balancing_frequency=-1

# Refinement is based on the mass in each cell
markers_kernel       = RefineCondition_mass

[cosmology]
active=true              ; Effectively use comoving coordinates and track expansion factor                
da=1.1                 ; Initial value of da to calculate the expansion table    
lookup_size=2048         ; Size of the expansion table lookup 

H0=67.66000366210938 km/s/Mpc

mass_coarsen_factor=1 ; Indications for the refinement/coarsening of the grid
mass_refine_factor=8

omegab=1e-6

[dt]
# Kernels used for dt calculation/restriction
# Takes the smallest value in the list
# Here we apply a dt on particle velocity and on the expansion factor
dt_kernel=Compute_dt_particle_velocity,Compute_dt_cosmology
particle_cfl=0.8

[grafic]
inputdir=./ICs/level_007 ; Grafic input file

[gravity]
#solver=GravitySolver_cg ; We use the ocnjugate gradient method to solve the Poisson equation
#cg_eps=1e-3             ; Convergence threshold for the CG   
solver=GravitySolver_multigrid

[hydro]
gamma0=1.666 ; Adiabatic index (5/3)               
update=none  ; No hydro for this run

[particles]
update_density=ParticleUpdate_CIC_density ; Density of the particles is interpolated using CIC
update_position=ParticleUpdate_CIC_move   ; Gravitational force is interpolated using CIC

[output]
backend              = IOManager_hdf5      
output_real_type     = float
outputdir            = ./                  
outputprefix         = cosmo     
write_variables      = level

write_particle_variables = particles/vx,particles/vy,particles/vz,particles/mass
       
[units]
time=1Gyr
length=1 Mpc
density=1 proton_mass / m3

        
